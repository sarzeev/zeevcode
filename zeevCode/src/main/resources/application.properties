# Server
server.port=${PORT:8081}

# Database
# For Supabase, use the JDBC connection string from Project Settings > Database.
# Example: jdbc:postgresql://aws-0-region.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zeevcode}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:5175}}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/zeevcode1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

# Firebase Admin
# In production, prefer FIREBASE_SERVICE_ACCOUNT as base64 JSON.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:../secrets/firebase-service-account.json}

# WebSocket
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536

# DevTools
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:false}
spring.devtools.livereload.enabled=${SPRING_DEVTOOLS_LIVERELOAD_ENABLED:false}

# Logging
logging.level.root=INFO
logging.level.com.project.zeevCode=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

# Execution Provider
# Options: piston, legacy-processbuilder, judge0, native
execution.provider=${EXECUTION_PROVIDER:native}

# Piston Configuration
piston.api.url=${PISTON_API_URL:http://localhost:2000}
piston.timeout.run=${PISTON_TIMEOUT_RUN:5000}
piston.timeout.compile=${PISTON_TIMEOUT_COMPILE:10000}
piston.memory.run=${PISTON_MEMORY_RUN:256000000}

# External APIs
youtube.api.key=${YOUTUBE_API_KEY:}

